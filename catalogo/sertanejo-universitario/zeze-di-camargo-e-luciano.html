  <div style="margin-bottom: 50px;">
    <a class="botao-whatsapp" href="javascript:void(0)" onclick="enviarWhatsApp()">Finalizar e Enviar lista completa</a>
    <br>
    <a href="../sertanejo-universitario.html" style="color: gold; display: block; margin-top: 20px;">⬅ Voltar para Artistas</a>

  <script>
    // Salva ou remove a música da lista global no localStorage
    function gerenciarSelecao(checkbox) {
      let lista = JSON.parse(localStorage.getItem('kantaplay_lista')) || [];
      const valor = checkbox.value;

      if (checkbox.checked) {
        if (!lista.includes(valor)) lista.push(valor);
      } else {
        lista = lista.filter(item => item !== valor);
      }

      localStorage.setItem('kantaplay_lista', JSON.stringify(lista));
      atualizarContador();
    }

    // Mantém os checkboxes marcados se o usuário já escolheu antes e atualiza o contador
    function inicializarPagina() {
      const lista = JSON.parse(localStorage.getItem('kantaplay_lista')) || [];
      const checkboxes = document.querySelectorAll('input[name="musica"]');
      
      checkboxes.forEach(cb => {
        if (lista.includes(cb.value)) cb.checked = true;
      });

      atualizarContador();
    }

    function atualizarContador() {
      const lista = JSON.parse(localStorage.getItem('kantaplay_lista')) || [];
      const contador = document.getElementById('contador-musicas');
      const qtd = document.getElementById('qtd-musicas');
      
      if (lista.length > 0) {
        contador.style.display = 'flex';
        qtd.innerText = lista.length;
      } else {
        contador.style.display = 'none';
      }
    }

    function enviarWhatsApp() {
      const lista = JSON.parse(localStorage.getItem('kantaplay_lista')) || [];
      const telefone = "5511972330562";

      if (lista.length === 0) {
        alert("Sua lista está vazia!");
        return;
      }

      const mensagem = encodeURIComponent("Olá Paulo! Fiz o Pix e aqui está minha lista completa:\n\n• " + lista.join("\n• "));
      window.open(`https://wa.me/${telefone}?text=${mensagem}`, "_blank");
    }

    document.addEventListener('DOMContentLoaded', inicializarPagina);
  </script>
